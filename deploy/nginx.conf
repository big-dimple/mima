limit_req_zone $binary_remote_addr zone=mima_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mima_auth:10m rate=12r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/null;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    location ~ ^/api/(auth/oidc/(start|callback|backchannel-logout)|session/(reauth|unlock))$ {
        limit_req zone=mima_auth burst=6 nodelay;
        proxy_pass http://api:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /api/v2/events {
        limit_req zone=mima_api burst=30 nodelay;
        proxy_pass http://api:4174;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /api/ {
        limit_req zone=mima_api burst=60 nodelay;
        proxy_pass http://api:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ~ ^/assets/crypto\.worker-[A-Za-z0-9_-]+\.js$ {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /downloads/mima-extension-0.2.0.zip {
        default_type application/zip;
        expires -1;
        try_files $uri =404;
    }

    location = /downloads/mima-recovery-tool-0.2.0.zip {
        default_type application/zip;
        expires -1;
        try_files $uri =404;
    }

    location = /downloads/mima-recovery-tool-0.2.0.zip.sha256 {
        default_type text/plain;
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
