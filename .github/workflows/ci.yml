name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, Web and extension tests
        run: pnpm test
      - name: Check generated API specifications
        run: pnpm api:specs:check
      - name: Check immutable migrations
        run: pnpm db:migrations:check
      - name: Audit public source
        run: pnpm public:audit
      - name: Build workspace
        run: pnpm build
      - name: Scan strict runtime artifacts
        run: pnpm runtime:scan

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: mima
          POSTGRES_USER: mima
          POSTGRES_PASSWORD: mima_dev_pw
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mima -d mima"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration
        env:
          MIMA_INTEGRATION_DATABASE_URL: postgres://mima:mima_dev_pw@127.0.0.1:55432/mima

  e2e:
    name: Chromium end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_DB: mima
          POSTGRES_USER: mima
          POSTGRES_PASSWORD: mima_dev_pw
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mima -d mima"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          MIMA_E2E_DATABASE_URL: postgres://mima:mima_dev_pw@127.0.0.1:55432/mima_test_e2e
