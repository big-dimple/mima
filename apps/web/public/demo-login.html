<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>演示登录页 · 扩展填充测试</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #f4f5f6; margin: 0; }
      form { background: #fff; border: 1px solid #e1e5e8; border-radius: 6px; padding: 28px; width: 300px; }
      h1 { font-size: 16px; margin: 0 0 16px; }
      label { display: block; font-size: 12px; color: #5d6c74; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c9cfd4; border-radius: 4px; }
      button { margin-top: 16px; width: 100%; padding: 9px; background: #0f766e; color: #fff; border: 0; border-radius: 4px; font-weight: 600; }
      #result { margin-top: 10px; font-size: 12px; color: #0f766e; min-height: 1em; }
    </style>
  </head>
  <body>
    <form id="demo-form">
      <h1>演示登录页（本地）</h1>
      <p style="font-size:12px;color:#8a969d">用于验证浏览器扩展只在网站地址完全匹配时填充表单。</p>
      <label for="user">用户名</label>
      <input id="user" name="username" type="text" autocomplete="username" />
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" />
      <button type="submit">登录</button>
      <div id="result"></div>
    </form>
    <script>
      document.getElementById('demo-form').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('result').textContent = '表单已提交（演示，无真实请求）';
      });
    </script>
  </body>
</html>
